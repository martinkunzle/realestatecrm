name: Verify CRM build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Inspect build output
        run: |
          find dist -maxdepth 3 -type f -print | sort
          echo "--- dist/server/wrangler.json ---"
          cat dist/server/wrangler.json
