name: Verify CRM build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Inspect deployed login response
        run: |
          curl --silent --show-error --include \
            --request POST \
            --header "content-type: application/json" \
            --data '{}' \
            "https://realestatecrm.martin-kunzle.workers.dev/api/auth/login"
